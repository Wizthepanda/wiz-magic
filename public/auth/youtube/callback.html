<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube OAuth Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #e74c3c;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Connecting your YouTube channel...</h2>
        <p>Please wait while we complete the authentication process.</p>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        async function handleCallback() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const error = urlParams.get('error');

                if (error) {
                    throw new Error(`OAuth error: ${error}`);
                }

                if (!code) {
                    throw new Error('No authorization code received');
                }

                // Exchange code for token
                const response = await fetch('https://oauth2.googleapis.com/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        client_id: new URLSearchParams(window.location.search).get('state') || '',
                        client_secret: new URLSearchParams(window.location.search).get('client_secret') || '', // Note: In production, this should be handled server-side
                        code: code,
                        grant_type: 'authorization_code',
                        redirect_uri: window.location.origin + '/auth/youtube/callback.html',
                    }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error_description || 'Failed to exchange code for token');
                }

                const tokenData = await response.json();

                // Send success message to parent window
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'YOUTUBE_OAUTH_SUCCESS',
                        token: tokenData
                    }, window.location.origin);
                    window.close();
                } else {
                    // Store token in localStorage and redirect
                    localStorage.setItem('youtube_access_token', tokenData.access_token);
                    if (tokenData.refresh_token) {
                        localStorage.setItem('youtube_refresh_token', tokenData.refresh_token);
                    }
                    window.location.href = '/#/dashboard/create';
                }

            } catch (error) {
                console.error('OAuth callback error:', error);
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';
                
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'YOUTUBE_OAUTH_ERROR',
                        error: error.message
                    }, window.location.origin);
                    setTimeout(() => window.close(), 3000);
                }
            }
        }

        // Start the callback handling process
        handleCallback();
    </script>
</body>
</html>
