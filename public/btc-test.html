<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Tipping Validation Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }
        .test-section.error {
            border-left-color: #f44336;
        }
        input, button {
            padding: 12px;
            margin: 10px 5px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        input {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            width: 150px;
        }
        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        .result {
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        .success {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4CAF50;
        }
        .error-result {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid #f44336;
        }
        h1, h2 {
            text-align: center;
        }
        .info {
            background: rgba(33, 150, 243, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪙 BTC Tipping Validation Test</h1>
        
        <div class="info">
            <strong>Testing the BTC validation fix:</strong><br>
            This page tests if small BTC amounts (like 0.0002 BTC) now pass validation without authentication.
        </div>

        <div class="test-section">
            <h2>Test BTC Amount Validation</h2>
            <div>
                <input type="number" id="btcAmount" placeholder="0.0002" step="0.00001" min="0">
                <button onclick="testBTCValidation()">Test BTC Validation</button>
            </div>
            <div id="btcResult"></div>
        </div>

        <div class="test-section">
            <h2>Pre-defined Tests</h2>
            <button onclick="runAllTests()">Run All Validation Tests</button>
            <div id="allTestsResult"></div>
        </div>

        <div class="test-section">
            <h2>Currency Minimums</h2>
            <div id="minimumInfo"></div>
        </div>
    </div>

    <script>
        // Replicate the validation logic from nowpayments-service.ts
        function getMinimumAmount(currency) {
            const curr = currency.toLowerCase();
            if (curr === 'btc') return 0.00001; // 0.00001 BTC minimum
            if (curr === 'doge') return 1; // 1 DOGE minimum
            return 0.01; // Default for USD, USDT, USDC
        }

        function validateTipAmount(amount, payCurrency) {
            const minimumAmount = getMinimumAmount(payCurrency);
            if (amount < minimumAmount) {
                throw new Error(`Invalid tip amount. Minimum ${minimumAmount} ${payCurrency.toUpperCase()}`);
            }
            return true;
        }

        function testBTCValidation() {
            const amount = parseFloat(document.getElementById('btcAmount').value);
            const resultDiv = document.getElementById('btcResult');
            
            if (isNaN(amount) || amount <= 0) {
                resultDiv.innerHTML = '<div class="result error-result">Please enter a valid amount</div>';
                return;
            }

            try {
                validateTipAmount(amount, 'btc');
                resultDiv.innerHTML = `<div class="result success">✅ SUCCESS: ${amount} BTC passes validation!</div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error-result">❌ ERROR: ${error.message}</div>`;
            }
        }

        function runAllTests() {
            const tests = [
                { amount: 0.0002, currency: 'btc', expected: 'pass' },
                { amount: 0.0005, currency: 'btc', expected: 'pass' },
                { amount: 0.001, currency: 'btc', expected: 'pass' },
                { amount: 0.000001, currency: 'btc', expected: 'fail' },
                { amount: 5, currency: 'usd', expected: 'pass' },
                { amount: 0.005, currency: 'usd', expected: 'fail' },
                { amount: 10, currency: 'doge', expected: 'pass' },
                { amount: 0.5, currency: 'doge', expected: 'fail' },
            ];

            let results = '<h3>Test Results:</h3>';
            let allPassed = true;

            tests.forEach((test, index) => {
                try {
                    validateTipAmount(test.amount, test.currency);
                    const passed = test.expected === 'pass';
                    results += `<div class="result ${passed ? 'success' : 'error-result'}">
                        Test ${index + 1}: ${test.amount} ${test.currency.toUpperCase()} - 
                        ${passed ? '✅ PASS' : '❌ UNEXPECTED PASS'}
                    </div>`;
                    if (!passed) allPassed = false;
                } catch (error) {
                    const passed = test.expected === 'fail';
                    results += `<div class="result ${passed ? 'success' : 'error-result'}">
                        Test ${index + 1}: ${test.amount} ${test.currency.toUpperCase()} - 
                        ${passed ? '✅ CORRECTLY REJECTED' : '❌ UNEXPECTED REJECTION'}
                        <br><small>${error.message}</small>
                    </div>`;
                    if (!passed) allPassed = false;
                }
            });

            results += `<div class="result ${allPassed ? 'success' : 'error-result'}">
                <strong>${allPassed ? '🎉 ALL TESTS PASSED!' : '⚠️ Some tests failed'}</strong>
            </div>`;

            document.getElementById('allTestsResult').innerHTML = results;
        }

        function showMinimums() {
            const currencies = ['btc', 'doge', 'usd', 'usdt', 'usdc'];
            let info = '<h3>Minimum Amounts:</h3>';
            
            currencies.forEach(currency => {
                const min = getMinimumAmount(currency);
                info += `<div class="result success">
                    <strong>${currency.toUpperCase()}:</strong> ${min} ${currency.toUpperCase()}
                </div>`;
            });
            
            document.getElementById('minimumInfo').innerHTML = info;
        }

        // Show minimums on load
        showMinimums();

        // Auto-run tests on load
        setTimeout(runAllTests, 500);
    </script>
</body>
</html>
