<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleanup Placeholder Communities</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    h1 {
      margin-top: 0;
      font-size: 2em;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px 5px;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      font-family: monospace;
      max-height: 400px;
      overflow-y: auto;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .warning { color: #fbbf24; }
    .info { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧹 Cleanup Placeholder Communities</h1>
    <p>This tool will delete the following placeholder communities from your Firestore database:</p>
    <ul>
      <li>Music Haven</li>
      <li>Fitness Lounge</li>
      <li>AI Creators</li>
    </ul>

    <button id="signInBtn" onclick="signIn()">Sign In with Google</button>
    <button id="cleanupBtn" onclick="cleanup()" disabled>Delete Placeholders</button>

    <div id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { getFirestore, doc, deleteDoc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    // Firebase config - replace with your actual config
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY_HERE",
      authDomain: "wiz-magic-platform.firebaseapp.com",
      projectId: "wiz-magic-platform",
      storageBucket: "wiz-magic-platform.firebasestorage.app",
      messagingSenderId: "485151111726",
      appId: "1:485151111726:web:e35bc51f68a8f55c5ce18e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const placeholderIds = ['fitness-lounge', 'ai-creators', 'music-haven'];

    function log(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      const timestamp = new Date().toLocaleTimeString();
      statusDiv.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
      statusDiv.scrollTop = statusDiv.scrollHeight;
    }

    window.signIn = async () => {
      try {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        log(`✅ Signed in as: ${result.user.email}`, 'success');
        document.getElementById('signInBtn').disabled = true;
        document.getElementById('cleanupBtn').disabled = false;
      } catch (error) {
        log(`❌ Sign in failed: ${error.message}`, 'error');
      }
    };

    window.cleanup = async () => {
      if (!auth.currentUser) {
        log('❌ Please sign in first', 'error');
        return;
      }

      document.getElementById('cleanupBtn').disabled = true;
      log('🧹 Starting cleanup process...', 'info');

      try {
        for (const id of placeholderIds) {
          const docRef = doc(db, 'communities', id);

          // Check if document exists
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
            const data = docSnap.data();
            log(`📄 Found: ${data.title || data.name || id}`, 'info');

            // First, update the creatorId to current user (to satisfy security rules)
            try {
              await updateDoc(docRef, {
                creatorId: auth.currentUser.uid
              });
              log(`   ✏️  Updated creatorId to ${auth.currentUser.uid}`, 'info');

              // Now delete it
              await deleteDoc(docRef);
              log(`   ✅ Deleted successfully`, 'success');
            } catch (error) {
              log(`   ❌ Failed to delete: ${error.message}`, 'error');
            }
          } else {
            log(`⏭️  Skipping: ${id} (not found)`, 'warning');
          }
        }

        log('✅ Cleanup complete! Refresh your app to see the changes.', 'success');
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
      }

      document.getElementById('cleanupBtn').disabled = false;
    };
  </script>
</body>
</html>
